worker_processes  1;

error_log  /dev/stdout warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    keepalive_timeout  65;
    proxy_read_timeout 120;

    server {
        include /etc/nginx/nginx-shine-server.conf;

        location /ping {
          default_type application/json;
          return 200 '{"Status":"OK"}';
        }

        location /identity/ {
            proxy_pass http://127.0.0.1:7000/identity/;
        }

        location = /builder/api/connect {
            proxy_pass http://127.0.0.1:7001/builder/api/connect;
            proxy_http_version 1.1;
            # The builder checks X-Forwarded-Host first, then Host. Preserve both so the
            # host allowlist sees ws.scytta.com and not the proxy_pass target (127.0.0.1:7001).
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Keep quiet long-lived sockets open (the http-level default is 120s).
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /builder/ {
            proxy_pass http://127.0.0.1:7001/builder/;
        }
    }
}