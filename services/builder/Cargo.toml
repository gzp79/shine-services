[package]
name = "shine-builder"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

uuid = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
ring = { workspace = true }
regex = { workspace = true }

############################# RUNTIME #############################
futures = { workspace = true }
futures-channel = { workspace = true }
tokio = { workspace = true }

############################# TRACING #############################
tracing = { workspace = true }
opentelemetry = { workspace = true }

############################# DB #############################
bb8 = { workspace = true }
redis = { workspace = true, features = [
    "tokio-comp",
    "tokio-rustls-comp",
    "json",
] }
bb8-postgres = { workspace = true }
tokio-postgres = { workspace = true, features = [
    "with-uuid-1",
    "with-chrono-0_4",
    "runtime",
] }
tokio-postgres-rustls = { workspace = true }
postgres-types = { workspace = true, features = ["derive"] }
postgres-from-row = { workspace = true }
refinery = { workspace = true, features = ["tokio-postgres"] }

############################# WEB #############################
axum = { workspace = true, features = ["ws"] }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
validator = { workspace = true }

shine-core = { workspace = true, features = ["tokio"] }
shine-game = { workspace = true }
shine-infra = { workspace = true }

[dev-dependencies]
rustls = { workspace = true, features = ["ring"] }
shine-test = { workspace = true, features = ["toxiproxy"] }
shine-infra-testing = { workspace = true }
