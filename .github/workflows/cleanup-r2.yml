name: Cleanup R2

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Web Client CI"]
    types: [completed]
    branches: [main]

env:
  R2_ENDPOINT: https://ce847ac4c44fb11af63e62ba34ec40db.r2.cloudflarestorage.com
  R2_BUCKET: shine-games

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: tests/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: tests
        run: pnpm install

      - name: Delete outdated content
        working-directory: tests
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm run r2:cleanup
