name: Web Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel outdated builds for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  R2_ENDPOINT: https://ce847ac4c44fb11af63e62ba34ec40db.r2.cloudflarestorage.com
  R2_BUCKET: shine-games

jobs:
  web-client-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Toolchain must be set up before the cargo cache so the cache key
      # matches the active toolchain.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: |
            client/web/pnpm-lock.yaml
            tests/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client/web
        run: pnpm install

      - name: Build WASM
        working-directory: client/web
        run: pnpm build:wasm

      - name: Build
        working-directory: client/web
        run: pnpm build

      - name: Test
        working-directory: client/web
        run: pnpm test

      - name: Install deploy tooling
        if: github.ref == 'refs/heads/main'
        working-directory: tests
        run: pnpm install

      - name: Deploy game bundle
        if: github.ref == 'refs/heads/main'
        working-directory: tests
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm run r2:deploy
