<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Shine Viewer</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #1a1a2e;
            }
            #app {
                width: 100vw;
                height: 100vh;
                position: relative;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            #nav {
                position: absolute;
                top: 8px;
                left: 8px;
                z-index: 20;
                display: flex;
                align-items: flex-start;
                gap: 6px;
            }
            #nav-toggle {
                width: 26px;
                height: 26px;
                line-height: 1;
                color: #fff;
                font-size: 14px;
                background: rgba(40, 40, 60, 0.9);
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 4px;
                cursor: pointer;
                outline: none;
            }
            #nav-toggle:hover {
                background: rgba(60, 60, 90, 0.9);
                border-color: rgba(255, 255, 255, 0.5);
            }
            #nav-tools {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            #nav.collapsed #nav-tools {
                display: none;
            }
            #heap-stats {
                display: none;
                color: #fff;
                font-family: monospace;
                font-size: 12px;
                line-height: 1.5;
                padding: 6px 12px;
                white-space: pre;
                background: rgba(40, 40, 60, 0.9);
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 4px;
            }
            #nav select,
            #local-login {
                color: #fff;
                font-family: monospace;
                font-size: 14px;
                padding: 6px 12px;
                background: rgba(40, 40, 60, 0.9);
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 4px;
                cursor: pointer;
                outline: none;
            }
            #local-login {
                text-align: center;
                text-decoration: none;
            }
            #nav select:hover,
            #local-login:hover {
                background: rgba(60, 60, 90, 0.9);
                border-color: rgba(255, 255, 255, 0.5);
            }
            #nav select option {
                background: #2a2a3e;
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div id="nav" class="collapsed">
            <button id="nav-toggle" type="button" title="Debug tools" aria-expanded="false">&#9881;</button>
            <div id="nav-tools">
                <select id="scene-select">
                    <option value="">Game</option>
                    <option value="hex-mesh">Hex Mesh</option>
                    <option value="cdt">CDT</option>
                    <option value="input-events">Input Events</option>
                    <option value="trilinear">Trilinear</option>
                    <option value="world-neighbors">World Neighbors</option>
                    <option value="tile-chunk">Tile Chunk</option>
                    <option value="instanced-color-mesh">Instanced Color Mesh</option>
                    <option value="asset-viewer">Asset Viewer</option>
                    <option value="pixel-map">Pixel Map</option>
                </select>
                <a id="local-login" href="" hidden>Local OIDC login</a>
                <div id="heap-stats"></div>
            </div>
        </div>
        <div id="app"></div>
        <script type="module">
            const nav = document.getElementById('nav');
            const toggle = document.getElementById('nav-toggle');
            const select = document.getElementById('scene-select');
            const login = document.getElementById('local-login');

            toggle.addEventListener('click', () => {
                const collapsed = nav.classList.toggle('collapsed');
                toggle.setAttribute('aria-expanded', String(!collapsed));
            });

            const isLocalMockClient =
                window.location.hostname === 'local.scytta.com' && window.location.port === '5173';
            if (isLocalMockClient) {
                const authUrl = new URL('https://cloud.local.scytta.com:8443/identity/auth/openid_flow/login');
                authUrl.searchParams.set('redirectUrl', window.location.href);
                authUrl.searchParams.set('errorUrl', window.location.href);
                authUrl.searchParams.set('rememberMe', 'true');
                authUrl.searchParams.set('captcha', 'skip');
                login.href = authUrl.toString();
                login.hidden = false;
            }

            // Update select based on hash
            function updateSelect() {
                const hash = window.location.hash.replace('#', '');
                select.value = hash;
            }

            // Navigate when select changes
            select.addEventListener('change', () => {
                const value = select.value;
                window.location.hash = value ? `#${value}` : '';
            });

            window.addEventListener('hashchange', updateSelect);
            updateSelect();
        </script>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
