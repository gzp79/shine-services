[package]
name = "shine-game"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Non-growing heap backed by a fixed static arena.
static-heap = ["dep:talc", "dep:lock_api"]
# Allocation metrics for the dev HUD.
heap-profile = ["talc?/counters"]

[dependencies]
log = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
glam = { workspace = true }
itertools = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
talc = { workspace = true, optional = true }
lock_api = { workspace = true, optional = true }

shine-core = { workspace = true }

################## wasm dependencies ##################
[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-web = { workspace = true }
tracing-subscriber = { workspace = true, default-features = false, features = ["registry"] }
wasm-logger = { workspace = true }
console_error_panic_hook = { workspace = true }
getrandom = { workspace = true, features = ["wasm_js"] }

js-sys = { workspace = true }
web-sys = { workspace = true, features = [
	"Window",
	"Response",
	"WorkerGlobalScope",
] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
shine-test = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
